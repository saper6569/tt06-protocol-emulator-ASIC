# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"
  author:       "Sanija, Aiden, Aaron"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A serially programmed processor for GPIO protocol emulation."
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Clock frequency in Hz

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_.v"
    - "instruction_programmer.v"
    - "instruction_memory.v"
    - "processor.v"
    - "timer.v"
    - "io_port.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Unused"
  ui[1]: "Unused"
  ui[2]: "Unused"
  ui[3]: "Unused"
  ui[4]: "Unused"
  ui[5]: "Processor run enable"
  ui[6]: "Programming data"
  ui[7]: "Programming enable"

  # Outputs
  uo[0]: "Processor address bit 0"
  uo[1]: "Processor address bit 1"
  uo[2]: "Processor address bit 2"
  uo[3]: "Processor address bit 3"
  uo[4]: "Processor address bit 4"
  uo[5]: "Processor address bit 5"
  uo[6]: "Processor address bit 6"
  uo[7]: "Processor address bit 7"

  # Bidirectional pins
  uio[0]: "GPIO 0"
  uio[1]: "GPIO 1"
  uio[2]: "GPIO 2"
  uio[3]: "GPIO 3"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# Do not change!
yaml_version: 6
